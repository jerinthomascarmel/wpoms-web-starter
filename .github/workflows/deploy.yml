name: Deploy to EC2

on:
  workflow_dispatch: 
  push:
    branches:
      - main
  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to the repo
            cd /home/${{ secrets.EC2_USER }}/jerin/wpoms-web-starter

            # 2. Pull the latest code
            git pull origin web_dev

            # 3. Stop and remove the existing container (ignore error if it doesn't exist)
            sudo docker stop wpoms-web-jerin-starter || true
            sudo docker rm wpoms-web-jerin-starter || true

            # 4. Build the new image
            sudo docker build -t wpoms-web-jerin-starter .

            # 5. Run the new container
            sudo docker run -d --name wpoms-web-jerin-starter -p 7777:8081 wpoms-web-starter
